name: Deploy staging
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: staging
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.gate.outputs.present }}
      host: ${{ steps.url.outputs.host }}
      version: ${{ steps.url.outputs.version }}
    env:
      STAGING_HOST: staging.open-bus.ai
      # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are step-scoped: only the
      # wrangler steps below get them, never pnpm install/build (dependency
      # scripts) (I8-08).
      # Non-secret instance values, recorded once from `pnpm ob:setup` against
      # staging (06-integration I4); the Worker secrets are set by that run.
      STAGING_OWNER_EMAIL: ${{ vars.STAGING_OWNER_EMAIL }}
      STAGING_ACCESS_TEAM_DOMAIN: ${{ vars.STAGING_ACCESS_TEAM_DOMAIN }}
      STAGING_ACCESS_CLIENT_ID: ${{ vars.STAGING_ACCESS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      # Skip cleanly rather than fail every push to main (a red staging pauses
      # all merges): until Backend lands apps/server, and, once the Worker
      # declares the Access vars (src/env.ts), until setup has made staging an
      # instance (the STAGING_* vars exist).
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - id: gate
        run: |
          auth=false
          if [ -f apps/server/src/env.ts ] && [ -f apps/server/wrangler.jsonc ]; then
            auth=$(node scripts/ops/check-staging-secrets.ts --access)
          fi
          echo "auth=$auth" >> "$GITHUB_OUTPUT"
          if [ ! -f apps/server/wrangler.jsonc ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
          elif [ "$auth" = true ] && { [ -z "$STAGING_OWNER_EMAIL" ] || [ -z "$STAGING_ACCESS_TEAM_DOMAIN" ] || [ -z "$STAGING_ACCESS_CLIENT_ID" ]; }; then
            echo "::notice title=staging deploy skipped::run pnpm ob:setup against staging and set vars.STAGING_OWNER_EMAIL, STAGING_ACCESS_TEAM_DOMAIN and STAGING_ACCESS_CLIENT_ID (docs/ops/staging.md)"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.present == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.gate.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.gate.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.gate.outputs.present == 'true'
        run: pnpm build
      - if: steps.gate.outputs.present == 'true'
        run: bash scripts/ci/ensure-dashboard-dist.sh
      # Staging is the Worker open-bus-staging on the custom domain STAGING_HOST
      # (00-overview §Delivery); apps/server/wrangler.jsonc binds that domain.
      # APP_HOST (no scheme) and VERSION are written at deploy time (02-backend's
      # config comment); VERSION is <package version>-<short sha> on staging.
      - name: staging URL and version
        if: steps.gate.outputs.present == 'true'
        id: url
        run: |
          version="$(node -p 'require("./package.json").version')-$(git rev-parse --short HEAD)"
          echo "host=$STAGING_HOST" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: preflight (required Worker secrets)
        if: steps.gate.outputs.present == 'true'
        working-directory: apps/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash ../../scripts/ci/staging-preflight.sh
      - name: clear Worker secrets that are also config vars
        if: steps.gate.outputs.present == 'true'
        working-directory: apps/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash ../../scripts/ci/staging-clear-conflicts.sh
      # Durable Object migrations live in wrangler.jsonc and are applied by the
      # deploy itself (00-overview §Delivery): there is no D1 step.
      - name: deploy
        if: steps.gate.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH: ${{ steps.gate.outputs.auth }}
          HOST: ${{ steps.url.outputs.host }}
          VERSION: ${{ steps.url.outputs.version }}
        run: |
          args=(--var "APP_HOST:$HOST" --var "VERSION:$VERSION")
          if [ "$AUTH" = true ]; then
            args+=(--var "OWNER_EMAIL:$STAGING_OWNER_EMAIL")
            args+=(--var "ACCESS_TEAM_DOMAIN:$STAGING_ACCESS_TEAM_DOMAIN")
            args+=(--var "ACCESS_CLIENT_ID:$STAGING_ACCESS_CLIENT_ID")
          fi
          pnpm --filter @ob/server exec wrangler deploy -c wrangler.jsonc "${args[@]}"
  smoke:
    needs: [deploy]
    if: ${{ needs.deploy.outputs.present == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: healthz
        run: bash scripts/ci/staging-smoke.sh healthz "https://${{ needs.deploy.outputs.host }}" "${{ needs.deploy.outputs.version }}"
      # Only when the Worker serves the device flow (B4 declares the route).
      - name: device flow
        run: |
          if grep -qF '"POST /device/code"' apps/server/src/auth/route-policy.ts; then
            bash scripts/ci/staging-smoke.sh device "https://${{ needs.deploy.outputs.host }}"
          else
            echo "::notice title=device smoke skipped::the route policy does not list POST /device/code yet (B4)"
          fi

name: Deploy staging
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: staging
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.gate.outputs.present }}
      host: ${{ steps.url.outputs.host }}
      version: ${{ steps.url.outputs.version }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      # No apps/server until Backend lands its first task: skip cleanly rather
      # than fail every push to main (a red staging pauses all merges).
      - id: gate
        run: |
          if [ -f apps/server/wrangler.jsonc ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.gate.outputs.present == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.gate.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.gate.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.gate.outputs.present == 'true'
        run: pnpm build
      - if: steps.gate.outputs.present == 'true'
        run: bash scripts/ci/ensure-dashboard-dist.sh
      # The Worker name comes from apps/server/wrangler.jsonc and the workers.dev
      # subdomain from the Workers API: neither is hardcoded (01-foundation F4c).
      # APP_HOST and VERSION are written at deploy time (02-backend.md's config
      # comment); VERSION is <package version>-<short sha> on staging.
      - name: staging URL and version
        if: steps.gate.outputs.present == 'true'
        id: url
        run: |
          name=$(node -e 'const s=require("fs").readFileSync("apps/server/wrangler.jsonc","utf8").replace(/\/\/.*$/gm,"").replace(/,(\s*[}\]])/g,"$1");console.log(JSON.parse(s).name)')
          subdomain=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).result.subdomain))')
          version="$(node -p 'require("./package.json").version')-$(git rev-parse --short HEAD)"
          echo "host=https://$name.$subdomain.workers.dev" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: preflight (required Worker secrets)
        if: steps.gate.outputs.present == 'true'
        working-directory: apps/server
        run: bash ../../scripts/ci/staging-preflight.sh
      - name: clear Worker secrets that are also config vars
        if: steps.gate.outputs.present == 'true'
        working-directory: apps/server
        run: bash ../../scripts/ci/staging-clear-conflicts.sh
      # Durable Object migrations live in wrangler.jsonc and are applied by the
      # deploy itself (00-overview §Delivery): there is no D1 step.
      - name: deploy
        if: steps.gate.outputs.present == 'true'
        run: >-
          pnpm --filter @ob/server exec wrangler deploy -c wrangler.jsonc
          --var "APP_HOST:${{ steps.url.outputs.host }}"
          --var "VERSION:${{ steps.url.outputs.version }}"
  smoke:
    needs: [deploy]
    if: ${{ needs.deploy.outputs.present == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: healthz
        run: bash scripts/ci/staging-smoke.sh healthz "${{ needs.deploy.outputs.host }}" "${{ needs.deploy.outputs.version }}"

name: CF token check
# Read-only: proves the Cloudflare token covers staging, the custom domains
# and the Access app (issue #4). Not a required check.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/ops/cf-token-check.ts
      - .github/workflows/cf-token-check.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --experimental-strip-types --no-warnings scripts/ops/cf-token-check.ts
